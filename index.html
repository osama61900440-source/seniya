<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Dashboard - Osama Business</title>
    
    <!-- Tailwind CSS (ለዲዛይኑ) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel (አፑን ብራውዘር ላይ ለማስኬድ) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase SDK (v9 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-messaging-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

    <!-- React App የሚቀመጥበት ቦታ -->
    <div id="root"></div>

    <script type="text/babel">
        // 1. የ Firebase ኮንፊግህ
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "osama-biznes.firebaseapp.com",
            projectId: "osama-biznes",
            storageBucket: "osama-biznes.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Firebase Initialize ማድረግ
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const messaging = firebase.messaging();

        // አንተ የሰጠኸው VAPID Key
        const VAPID_KEY = "BLkxZdtKtyrhGgj7gRDaOMYq-WLjAxt0tyyPnleZ7Rs043Qbv8kVssq7Ud3-Jhm9VyNt8K1OY9Oncz4IJkkI37w";

        // 2. Dashboard Component
        function Dashboard() {
            const [stores, setStores] = React.useState([]);
            const [stats, setStats] = React.useState({ totalStores: 0, totalUsers: 0, todaySales: 0, activeSubPercentage: 0 });
            const [searchTerm, setSearchTerm] = React.useState('');
            const [trialDays, setTrialDays] = React.useState(14);

            // Dynamic Broadcast Form State
            const [broadcast, setBroadcast] = React.useState({
                platform: 'youtube',
                title: '',
                url: '',
                message: '',
                targetPref: 'youtubeBroadcasts'
            });

            // Realtime Firestore Listener
            React.useEffect(() => {
                const unsubscribe = db.collection("stores").onSnapshot((snapshot) => {
                    let storeList = [];
                    let totalUsersCount = 0;
                    let activeCount = 0;
                    let salesToday = 0;

                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        storeList.push({ id: doc.id, ...data });
                        totalUsersCount += (data.staffCount || 1);
                        if (data.status === 'active') activeCount++;
                        salesToday += (data.todaySales || 0);
                    });

                    setStores(storeList);
                    setStats({
                        totalStores: storeList.length,
                        totalUsers: totalUsersCount,
                        todaySales: salesToday,
                        activeSubPercentage: storeList.length ? Math.round((activeCount / storeList.length) * 100) : 0
                    });
                });

                return () => unsubscribe();
            }, []);

            // Icons ለመጫን
            React.useEffect(() => {
                lucide.createIcons();
            }, [stores]);

            // Status Toggle Action
            const toggleStoreStatus = async (storeId, currentStatus) => {
                const newStatus = currentStatus === 'active' ? 'blocked' : 'active';
                await db.collection("stores").doc(storeId).update({ status: newStatus });
            };

            // Extend Subscription Action
            const extendSubscription = async (storeId, months) => {
                const store = stores.find(s => s.id === storeId);
                let currentEndDate = store.subscriptionEnd ? store.subscriptionEnd.toDate() : new Date();
                if (currentEndDate < new Date()) currentEndDate = new Date();
                currentEndDate.setMonth(currentEndDate.getMonth() + months);

                await db.collection("stores").doc(storeId).update({
                    subscriptionEnd: currentEndDate,
                    status: 'active'
                });
            };

            // Broadcast Send Action
            const handleSendBroadcast = async () => {
                if (!broadcast.title || !broadcast.message) {
                    alert("እባክዎን Title እና Message ያስገቡ!");
                    return;
                }

                await db.collection("broadcasts").add({
                    platform: broadcast.platform,
                    title: broadcast.title,
                    url: broadcast.url || '',
                    message: broadcast.message,
                    targetPreference: broadcast.targetPref,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("ማስታወቂያው በተመረጠው ካቴጎሪ መሰረት በተሳካ ሁኔታ ተልኳል!");
                setBroadcast({ platform: 'youtube', title: '', url: '', message: '', targetPref: 'youtubeBroadcasts' });
            };

            return (
                <div className="p-6 max-w-7xl mx-auto">
                    {/* Header */}
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8 border-b border-slate-800 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-white flex items-center gap-2">
                                <i data-lucide="shield-alert" class="text-indigo-500"></i> Super Admin Control Dashboard
                            </h1>
                            <p className="text-sm text-slate-400">የሲስተሙን እንቅስቃሴ እና ማስታወቂያዎችን እዚህ ይቆጣጠሩ</p>
                        </div>
                        <div className="flex items-center gap-3">
                            <a href="https://t.me/YourTelegramUsername" target="_blank" className="bg-sky-600/20 text-sky-400 border border-sky-500/30 px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 hover:bg-sky-600/30 transition">
                                <i data-lucide="message-circle" class="w-4 h-4"></i> የቀጥታ እርዳታ (Telegram)
                            </a>
                            <div className="bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 px-4 py-2 rounded-xl text-sm font-semibold">
                                System Live 🟢
                            </div>
                        </div>
                    </div>

                    {/* Analytics Cards */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
                        <div className="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-5">
                            <div className="flex items-center justify-between mb-3">
                                <span className="text-slate-400 text-sm font-medium">Total Stores</span>
                                <i data-lucide="store" class="text-blue-400"></i>
                            </div>
                            <div className="text-2xl font-bold text-white mb-1">{stats.totalStores}</div>
                            <div className="text-xs text-slate-500">በሲስተሙ የተመዘገቡ</div>
                        </div>
                        <div className="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-5">
                            <div className="flex items-center justify-between mb-3">
                                <span className="text-slate-400 text-sm font-medium">Total Users</span>
                                <i data-lucide="users" class="text-emerald-400"></i>
                            </div>
                            <div className="text-2xl font-bold text-white mb-1">{stats.totalUsers}</div>
                            <div className="text-xs text-slate-500">ባለቤቶች + ሰራተኞች</div>
                        </div>
                        <div className="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-5">
                            <div className="flex items-center justify-between mb-3">
                                <span className="text-slate-400 text-sm font-medium">Today Sales</span>
                                <i data-lucide="dollar-sign" class="text-amber-400"></i>
                            </div>
                            <div className="text-2xl font-bold text-white mb-1">{stats.todaySales.toLocaleString()} ETB</div>
                            <div className="text-xs text-slate-500">የዛሬው የሲስተም ሽያጭ</div>
                        </div>
                        <div className="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-5">
                            <div className="flex items-center justify-between mb-3">
                                <span className="text-slate-400 text-sm font-medium">Active Subscriptions</span>
                                <i data-lucide="award" class="text-purple-400"></i>
                            </div>
                            <div className="text-2xl font-bold text-white mb-1">{stats.activeSubPercentage}%</div>
                            <div className="text-xs text-slate-500">ንቁ ክፍያ ያላቸው</div>
                        </div>
                    </div>

                    {/* Main Content Grid */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        {/* Table */}
                        <div className="lg:col-span-2 bg-slate-800/50 border border-slate-700/50 rounded-2xl p-6">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                                <h2 className="text-lg font-bold text-white">የሱቆች እና Subscription አስተዳደር</h2>
                                <input
                                    type="text"
                                    placeholder="ሱቅ ወይም ስልክ ፈልግ..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-indigo-500 w-full sm:w-64"
                                />
                            </div>

                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm text-slate-300">
                                    <thead className="bg-slate-900/60 text-slate-400 uppercase text-xs">
                                        <tr>
                                            <th className="p-3">የሱቅ ስም</th>
                                            <th className="p-3">ባለቤት/ስልክ</th>
                                            <th className="p-3">Status</th>
                                            <th className="p-3">Subscription</th>
                                            <th className="p-3 text-center">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-700/50">
                                        {stores.filter(s => s.name?.toLowerCase().includes(searchTerm.toLowerCase())).map((store) => (
                                            <tr key={store.id} className="hover:bg-slate-700/20">
                                                <td className="p-3 font-semibold text-white">{store.name}</td>
                                                <td className="p-3">
                                                    <div>{store.ownerName}</div>
                                                    <div className="text-xs text-slate-400">{store.phone}</div>
                                                </td>
                                                <td className="p-3">
                                                    <span className={`px-2 py-1 text-xs rounded-full font-medium ${
                                                        store.status === 'active' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20'
                                                    }`}>
                                                        {store.status}
                                                    </span>
                                                </td>
                                                <td className="p-3">
                                                    <div className="flex gap-1">
                                                        <button onClick={() => extendSubscription(store.id, 1)} className="px-2 py-1 bg-indigo-600/30 hover:bg-indigo-600 text-indigo-300 text-xs rounded-lg transition">+1 ወር</button>
                                                        <button onClick={() => extendSubscription(store.id, 12)} className="px-2 py-1 bg-purple-600/30 hover:bg-purple-600 text-purple-300 text-xs rounded-lg transition">+1 ዓመት</button>
                                                    </div>
                                                </td>
                                                <td className="p-3 text-center">
                                                    <button onClick={() => toggleStoreStatus(store.id, store.status)} className={`px-3 py-1 rounded-lg text-xs font-medium transition ${store.status === 'active' ? 'bg-red-600/20 text-red-400 hover:bg-red-600/40' : 'bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600/40'}`}>
                                                        {store.status === 'active' ? 'Block' : 'Unblock'}
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Right Broadcast Panel */}
                        <div className="space-y-6">
                            <div className="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-6 space-y-4">
                                <h2 className="text-lg font-bold text-white flex items-center gap-2">
                                    <i data-lucide="send" class="text-indigo-400 w-5 h-5"></i> Social & Ads Broadcast
                                </h2>

                                <div>
                                    <label className="text-xs text-slate-400 block mb-1">የማስታወቂያው ዓይነት</label>
                                    <select 
                                        value={broadcast.platform}
                                        onChange={(e) => {
                                            const p = e.target.value;
                                            setBroadcast({
                                                ...broadcast, 
                                                platform: p,
                                                targetPref: (p === 'youtube' || p === 'tiktok' || p === 'telegram') ? 'youtubeBroadcasts' : 'systemAnnouncements'
                                            });
                                        }}
                                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                                    >
                                        <option value="youtube">📺 YouTube Video Broadcast</option>
                                        <option value="tiktok">🎵 TikTok Video Promo</option>
                                        <option value="telegram">✈️ Telegram Channel Link</option>
                                        <option value="system">🔔 App System Announcement</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="text-xs text-slate-400 block mb-1">የማስታወቂያው ርዕስ (Title)</label>
                                    <input 
                                        type="text" 
                                        placeholder="e.g. አዲስ የቢዝነስ ቪዲዮ ተለቋል!" 
                                        value={broadcast.title}
                                        onChange={(e) => setBroadcast({ ...broadcast, title: e.target.value })}
                                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
                                    />
                                </div>

                                {broadcast.platform !== 'system' && (
                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">የሊንኩ አድራሻ (URL)</label>
                                        <input 
                                            type="url" 
                                            placeholder="https://..." 
                                            value={broadcast.url}
                                            onChange={(e) => setBroadcast({ ...broadcast, url: e.target.value })}
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
                                        />
                                    </div>
                                )}

                                <div>
                                    <label className="text-xs text-slate-400 block mb-1">የመልእክቱ ዝርዝር (Message)</label>
                                    <textarea 
                                        rows="2"
                                        placeholder="መልእክትዎን እዚህ ይጻፉ..."
                                        value={broadcast.message}
                                        onChange={(e) => setBroadcast({ ...broadcast, message: e.target.value })}
                                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
                                    />
                                </div>

                                <div className="p-3 bg-slate-900/60 rounded-xl text-xs text-slate-400 border border-slate-700/40">
                                    🎯 ይህ ማስታወቂያ በሲቲንግ ገጻቸው ላይ <b>{broadcast.targetPref === 'youtubeBroadcasts' ? 'የቢዝነስ ብሮድካስት ማሳወቂያ' : 'የሲስተም ማሳወቂያ'}</b> ማብሪያን <b>ON</b> ላደረጉ ብቻ ይላካል።
                                </div>

                                <button onClick={handleSendBroadcast} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl text-sm transition flex justify-center items-center gap-2">
                                    ማስታወቂያ አስተላልፍ
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Render React Component
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
